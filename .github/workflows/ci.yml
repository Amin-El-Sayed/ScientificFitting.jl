name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The suite is compilation-bound, so wall clock is bought with parallel
  # shards, not platform coverage: three runtime-balanced shards per Julia
  # version, Linux only. macOS is exercised by local development and stays
  # out of the pull-request path after a shardless macOS job hit the 6 h
  # runner limit.
  core:
    name: Core tests - Julia ${{ matrix.version }} - shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        shard: ["1", "2", "3"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Core tests without plot rendering
        run: julia --project=. --startup-file=no -e 'include("test/core_runtests.jl")'
        env:
          SCIENTIFICFITTING_TEST_SHARD: ${{ matrix.shard }}
      - name: Startup probe gate
        if: matrix.shard == '1'
        run: julia --project=. --startup-file=no test/startup_probe_gate.jl
      - name: Performance budget gate
        if: matrix.shard == '1'
        run: julia --project=. --startup-file=no test/performance_budget_gate.jl
        env:
          SCIENTIFICFITTING_PERFORMANCE_BUDGET_SCALE: "4.0"

  ecosystem:
    name: Optional model and solver integrations - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1.11", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Test extension without requiring it in the core environment
        run: >-
          julia --startup-file=no -e 'using Pkg;
          Pkg.activate(; temp=true); Pkg.develop(path=pwd());
          deps = [PackageSpec(name=name) for name in
            ["BuildConstructors", "Distributions", "DistributionsHEP", "NumericalDistributions", "ForwardDiff"]];
          VERSION >= v"1.11" && push!(deps, PackageSpec(name="NativeMinuit", version="0.7.2"));
          VERSION >= v"1.12" && append!(deps,
            [PackageSpec(name="Turing", version="0.48"), PackageSpec(name="FlexiChains", version="0.6")]);
          Pkg.add(deps);
          include("test/extensions/distribution_ecosystem.jl");
          include("test/extensions/composite_distributions.jl");
          include("test/extensions/buildconstructors.jl");
          if VERSION >= v"1.11";
            include("test/extensions/native_minuit.jl");
            include("test/extensions/model_composition.jl");
          end;
          VERSION >= v"1.12" && include("test/extensions/turing_likelihood.jl")'

  package:
    name: Package test - Julia ${{ matrix.version }} - CairoMakie ${{ matrix.cairo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.10"
            cairo: "0.13"
          - version: "1"
            cairo: "0.15.14"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Install the supported plotting version
        run: julia --project=. -e 'using Pkg; Pkg.add(PackageSpec(name="CairoMakie", version="${{ matrix.cairo }}"))'
      # The plotting slice checks the Pkg.test sandbox resolution and the
      # pinned Makie compatibility; the core shards above already run the
      # full Makie-free suite. A plain `Pkg.test()` still runs everything.
      - name: Pkg.test (plotting slice)
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(; allow_reresolve=false)'
        env:
          SCIENTIFICFITTING_TEST_SLICE: plots

  docs:
    name: Documentation, plots, and docs gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate package
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Instantiate docs
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Source documentation gates
        run: |
          julia --project=. --startup-file=no test/docs_gallery_gate.jl
          julia --project=. --startup-file=no test/docs_public_release_gate.jl
          julia --project=. --startup-file=no test/docs_api_reference_gate.jl
          julia --project=. --startup-file=no test/docs_link_gate.jl
      - name: Plot regression tests
        run: julia --project=docs --startup-file=no test/plots/fitplot.jl
      - name: Build docs
        run: julia --project=docs --startup-file=no docs/make.jl
        env:
          SCIENTIFICFITTING_DOCS_SKIP_DEVELOP: "1"
      - name: Rendered documentation link gate
        run: julia --project=. --startup-file=no test/docs_html_link_gate.jl
      - name: Documentation output snapshot gate
        run: julia --project=. --startup-file=no test/docs_output_snapshots.jl
