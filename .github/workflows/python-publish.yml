name: Publish Python

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag; the Julia core must already be registered"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: python-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require a release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build python --outdir dist
          python -m twine check --strict dist/*
      - name: Check installed wheel against the registered Julia core
        run: |
          # A fresh environment must not inherit the CI development override.
          python -m venv "$RUNNER_TEMP/release-check"
          "$RUNNER_TEMP/release-check/bin/python" -m pip install dist/*.whl
          JULIA_DEPOT_PATH="$RUNNER_TEMP/release-julia-depot" \
          PYTHON_JULIAPKG_PROJECT="$RUNNER_TEMP/release-julia-project" \
          "$RUNNER_TEMP/release-check/bin/python" python/tests/check_install.py --output registry-install.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: python-registry-install-check
          path: registry-install.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scientificfitting/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
