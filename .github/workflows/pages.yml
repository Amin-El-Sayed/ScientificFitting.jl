name: Documentation Pages

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
      - name: Instantiate documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Check public documentation sources
        run: |
          julia --project=. --startup-file=no test/docs_public_release_gate.jl
          julia --project=. --startup-file=no test/docs_visual_snapshot_gate.jl
      - name: Build documentation
        run: julia --project=docs --startup-file=no docs/make.jl
        env:
          SCIENTIFICFITTING_DOCS_SKIP_DEVELOP: "1"
      - name: Check rendered links
        run: julia --project=. --startup-file=no test/docs_html_link_gate.jl
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
